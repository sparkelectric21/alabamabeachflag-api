name: IPAWS staging receiver

on:
  pull_request:
    paths:
      - "src/ipaws/**"
      - "src/types.ts"
      - "test/ipaws-*.spec.ts"
      - "test/fixtures/sns-*"
      - "docs/IPAWS_STAGING_RECEIVER.md"
      - "docs/IPAWS_SECURITY_REVIEW.md"
      - "docs/IPAWS_PRODUCTION_CONSUMER.md"
      - "docs/IPAWS_PR_DRAFT.md"
      - "package.json"
      - "package-lock.json"
      - "wrangler.ipaws.staging.jsonc"
      - "wrangler.ipaws.production.jsonc"
      - "worker-configuration.d.ts"
      - "worker-configuration.ipaws-staging.d.ts"
      - "worker-configuration.ipaws-production.d.ts"
      - "tsconfig.ipaws-staging.json"
      - "tsconfig.ipaws-production.json"
      - "scripts/validate-ipaws-deployment-policy.mjs"
      - "scripts/validate-production-release-governance.mjs"
      - "scripts/validate-ipaws-production-evidence.mjs"
      - "scripts/verify-ipaws-production-deployment.mjs"
      - "scripts/deploy-ipaws-production-disabled-baseline.mjs"
      - "scripts/refuse-direct-production-deploy.mjs"
      - "scripts/report-ipaws-production-inputs.mjs"
      - "config/ipaws-production-evidence.json"
      - "docs/IPAWS_PRODUCTION_RELEASE_GOVERNANCE.md"
      - "docs/IPAWS_PRODUCTION_DEPLOYMENT_INCIDENT_2026-10-02.md"
      - ".github/workflows/ipaws-production-disabled-baseline.yml"
      - ".github/workflows/ipaws-staging.yml"
  push:
    branches:
      - "main"
      - "codex/events-intelligence-checkpoint"
      - "codex/ipaws-staging-receiver"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Reject critical development dependency advisories
        run: npm audit --audit-level=critical
      - name: Changed-file whitespace check
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" -- . ':!worker-configuration.d.ts' ':!worker-configuration.ipaws-staging.d.ts' ':!worker-configuration.ipaws-production.d.ts'
      - name: Type check
        run: npm run typecheck
      - name: Staging Worker type check
        run: npm run typecheck:staging
      - name: IPAWS production Worker type check
        run: npm run typecheck:ipaws-production
      - name: Static lint checks
        run: npm run lint
      - name: Focused IPAWS tests
        run: npm test -- test/ipaws-sns.spec.ts test/ipaws-ingestion.spec.ts test/ipaws-worker.spec.ts test/ipaws-production-readiness.spec.ts
      - name: Full test suite
        run: npm test
      - name: Check production-generated Worker types
        run: npm run cf-typecheck
      - name: Check staging-generated Worker types
        run: npm run cf-typecheck:staging
      - name: Check IPAWS production-generated Worker types
        run: npm run cf-typecheck:ipaws-production
      - name: Validate IPAWS deployment policy template
        run: npm run validate:ipaws-deployment-policy
      - name: Validate production release governance
        run: npm run validate:production-release-governance
      - name: Validate production evidence template
        run: npm run validate:ipaws-production-evidence
      - name: Inventory unresolved production inputs
        run: npm run inventory:ipaws-production-inputs
      - name: Validate configured disabled production baseline
        run: npm run validate:ipaws-production-deploy
      - name: Confirm unresolved external evidence blocks production release
        run: if npm run validate:ipaws-production-evidence -- --require-complete; then echo "production evidence unexpectedly complete"; exit 1; fi
      - name: Validate production bundle and bindings without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/production-dry-run --config wrangler.jsonc
      - name: Validate staging bundle and bindings
        run: npx wrangler deploy --dry-run --outdir /tmp/ipaws-staging-dry-run --config wrangler.ipaws.staging.jsonc
      - name: Validate inert IPAWS production template bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/ipaws-production-dry-run --config wrangler.ipaws.production.jsonc
